[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "thairag"
version = "0.1.0"
description = "Thai retrieval-augmented generation (BM25, Gemini embeddings, hybrid) with an evaluation harness"
requires-python = ">=3.10"
dependencies = [
    "google-genai>=1.0",
    "numpy>=1.26",
    "pythainlp>=5.0",
    "python-dotenv>=1.0",
    "rank-bm25>=0.2.2",
]

[tool.setuptools]
packages = ["thairag"]
